<!DOCTYPE html>
<html>
<head>
<title>HorizonBoost Dev Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
margin:0;
background:#0f172a;
color:white;
}

.navbar{
padding:15px 30px;
background:#020617;
display:flex;
justify-content:space-between;
}

.container{
max-width:1000px;
margin:40px auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
background:#22c55e;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
color:white;
font-weight:bold;
}

button:hover{
background:#16a34a;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:none;
}

.login-box{
max-width:400px;
margin:120px auto;
background:#1e293b;
padding:30px;
border-radius:12px;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">

<h2>Dev Login</h2>

<input type="email" id="email" placeholder="Enter Email">

<button onclick="login()">Login</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="navbar">
  <div>HorizonBoost Dev</div>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<h2>Bookings</h2>

<div id="list"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCsFshu5jFYa5rkdE9YBaRZSygBhN0rHXQ",
  authDomain: "horizonboost-536ed.firebaseapp.com",
  projectId: "horizonboost-536ed",
  storageBucket: "horizonboost-536ed.firebasestorage.app",
  messagingSenderId: "483833292439",
  appId: "1:483833292439:web:aa633917567ac651c9ebd2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ✅ ALLOWED EMAILS
const allowedEmails = [
"aw060554@gmail.com"
];

// LOGIN
window.login = function(){

const email = document.getElementById("email").value;

if(allowedEmails.includes(email)){

localStorage.setItem("devLoggedIn", "true");

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

loadDashboard();

}else{
alert("Access denied");
}

}

// LOGOUT
window.logout = function(){

localStorage.removeItem("devLoggedIn");

location.reload();

}

// AUTO LOGIN
if(localStorage.getItem("devLoggedIn") === "true"){

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

loadDashboard();

}

// DASHBOARD
function loadDashboard(){

const list = document.getElementById("list");

const sound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

let firstLoad = true;

onSnapshot(collection(db, "bookings"), (snapshot)=>{

list.innerHTML = "";

snapshot.forEach(docSnap=>{

const b = docSnap.data();

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<div>
<strong>${b.date}</strong><br>
${b.time}<br>
Status: ${b.status || "Pending"}
</div>

<button onclick="confirmBooking('${docSnap.id}')">
Confirm
</button>
`;

list.appendChild(card);

});

// 🔔 ALERT
if(!firstLoad){
sound.play();
alert("🚀 New booking received!");
}

firstLoad = false;

});

}

// CONFIRM BOOKING
window.confirmBooking = async function(id){

const ref = doc(db, "bookings", id);

await updateDoc(ref, {
status: "Booked"
});

alert("Booking confirmed!");

}

</script>

</body>
</html>
